paths:
  raw_dir: data/raw
  cache_dir: data/cache
  normalized_dir: data/normalized
  output_dir: data/output
  review_dir: data/review

utilities:
  - desc
  - gpc
utility_files:
  - utilities/desc.yaml
  - utilities/gpc.yaml

thresholds_km:
  near: 1.6
  local: 8.0
  maximum: 40.0
timeline_gap_days:
  near: 90
  moderate: 180
  distant: 365
display:
  distance_unit: km
  timezone: America/New_York
geometry:
  projected_crs: EPSG:5070
  # West, south, east, north. Georgia reaches about -85.6; the margin keeps Alabama tie endpoints.
  bbox: [-86.0, 30.0, -78.0, 36.0]
osm:
  overpass_url: https://overpass-api.de/api/interpreter
  timeout_seconds: 300
  max_retries: 3
  max_response_bytes: 209715200
  backoff_seconds: 30
  user_agent: GridLock/0.1 (ShellHacks 2026 public-infrastructure research; one-off bulk cache)
  feature_types: [substation, line]
  query_version: v2
ai:
  enabled: false
normalization:
  date_formats: ["%m/%d/%Y", "%m/%d/%y"]
  # A voltage token: a number or a chain of numbers joined by - or / followed by kV ("230-115kV").
  voltage_pattern: '(?<![\w.])((?:\d+(?:\.\d+)?\s*[-/]\s*)*\d+(?:\.\d+)?)\s*kV\b'
  endpoints:
    # Title prefixes that name a sponsor or program, not a place ("SAV: ", "CC - ", "GRID - ").
    ignored_prefix_patterns:
      - '^[A-Z]{2,5}:\s*'
      - '^(?:CC|GRID)\s*[-–]\s*'
    # Customer-connection titles often name customer sites rather than substations.
    review_prefix_patterns:
      - '^(?:[A-Z]{2,5}:\s*)?CC\s*[-–]'
    separator_pattern: '\s*[-–]\s*'
    # The endpoint section of a title ends at the first voltage token or colon.
    section_end_patterns:
      - '(?<![\w.])(?:\d+(?:\.\d+)?\s*[-/]\s*)*\d+(?:\.\d+)?\s*kV\b'
      - ':'
    # Titles containing these name more than one circuit or site; only the first is used.
    multi_site_markers: [" & ", "/", ","]
    # Words that describe work rather than a place; a site name ends at the first one.
    descriptor_words:
      - SUBSTATION
      - SUB
      - CUSTOMER SUB
      - SWITCHING STATION
      - TAP
      - LINE
      - LOOP
      - TIE
      - TRANSMISSION
      - REBUILD
      - RECONDUCTOR
      - REACTOR
      - REACTORS
      - AUTOBANK
      - AUTOBANKS
      - AUTO BANK
      - BANK
      - CAP BANK
      - CAPACITOR
      - TRANSFORMER
      - NEW BUILD
      - NEW AUTO
      - NEW SUB
      - RELAY
      - RELAYS
      - RELAYING
      - BREAKER
      - BUS
      - BUSES
      - SWITCH
      - STATCOM
      - SMART VALVE
      - SMART VALVES
      - LOW SIDE
      - AREA
      - PROJECT
      - NETWORK
      - IMPROVEMENT
      - IMPROVEMENTS
      - UPGRADE
      - UPGRADES
      - EQUIPMENT
      - AKA
      - CC
    # Leftover bare numbers and punctuation at the end of a site name ("THOMASTON 230").
    trailing_noise_pattern: '(?:\s+\d[\d/]*|[\s.,;&/]+)+$'
    # A voltage unit left in a site name means the title did not match the voltage pattern (e.g. "23O KV").
    residue_pattern: '\bkV\b'
  project_types:
    rules:
      - type: reactor
        keywords: [REACTOR, REACTORS]
      - type: substation
        keywords: [SUBSTATION, SUB, AUTOBANK, AUTOBANKS, AUTO BANK, AUTO TRANSFORMER, TRANSFORMER, BANK,
                   CAP BANK, CAPACITOR, STATCOM, RELAY, RELAYS, RELAYING, BREAKER, BUS, BUSES, SWITCH,
                   SWITCHING STATION, SW HOUSE, LINE TRAP]
      - type: transmission_line
        keywords: [LINE, REBUILD, REBLD, RECONDUCTOR, TIE, TAP, FOLD-IN, LOOP, CONVERSION]
    # Used when no keyword matches but the title names two or more endpoints.
    endpoint_pair_type: transmission_line
    default_type: other
resolution:
  candidate_power_types: [substation]
  name_match_threshold: 90
  name_noise_words: [substation, sub, switching, switchyard, station, primary, pri, plant, dam]
  name_abbreviations: {n: north, s: south, e: east, w: west, jct: junction, rd: road}
  name_leading_abbreviations: {st: saint, ft: fort, mt: mount}
  name_suffix_equivalents: {borough: boro, burgh: burg}
  distinguishing_tokens: [north, south, east, west, upper, lower, new, old]
  same_site_radius_km: 3.0
  max_endpoint_separation_km: 250
  max_candidates_per_endpoint: 5
  tie_keywords: [TIE, TIES]
  tie_exclusion_phrases: [BUS TIE, BUS-TIE]
  overrides_file: overrides/geometry_overrides.yaml
# Handoff section 10. Part maxima: source 20 + identity 30 + geometry 35 + timeline 15 = 100.
evidence:
  source: {official_with_id: 20, official_weak_id: 15, secondary: 5, none: 0}
  identity: {name: 10, operator: 10, voltage: 5, region: 5}
  geometry:
    verified_full_line: 35
    verified_endpoints_straight_line: 30
    verified_endpoint_route: 22
    verified_single_endpoint: 15
    human_verified_override: 15
    approximate_area_centroid: 5
    unresolved: 0
  timeline: {construction_window: 15, start_and_in_service: 15, in_service_date: 10, unknown: 0}
  levels: {high: 80, medium: 50}
# The sponsor's Projects_Overlaps.xlsx (in the raw folder): a sanity check only, never pipeline input.
oracle:
  file: Projects_Overlaps.xlsx
  sheet: projects
  project_ids:
    DESC_1: DESC-6809-E
    DESC_2: DESC-6810-A
    DESC_3: DESC-06367-D-G
    DESC_4: DESC-6807-B
    DESC_5: DESC-6808-S
    GPC_1: GPC-20793
    GPC_2: GPC-20277
    GPC_3: GPC-20065
    GPC_4: GPC-18492
    GPC_5: GPC-11821
