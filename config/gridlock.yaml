paths:
  raw_dir: data/raw
  cache_dir: data/cache
  normalized_dir: data/normalized
  output_dir: data/output
  review_dir: data/review

utilities:
  - desc
  - gpc
utility_files:
  - utilities/desc.yaml
  - utilities/gpc.yaml

thresholds_km:
  near: 1.6
  local: 8.0
  maximum: 40.0
timeline_gap_days:
  near: 90
  moderate: 180
  distant: 365
display:
  distance_unit: km
  timezone: America/New_York
geometry:
  projected_crs: EPSG:5070
  # West, south, east, north. Georgia reaches about -85.6; the margin keeps Alabama tie endpoints.
  bbox: [-86.0, 30.0, -78.0, 36.0]
osm:
  overpass_url: https://overpass-api.de/api/interpreter
  timeout_seconds: 300
  max_retries: 3
  max_response_bytes: 209715200
  backoff_seconds: 30
  user_agent: GridLock/0.1 (ShellHacks 2026 public-infrastructure research; one-off bulk cache)
  feature_types: [substation, line]
  query_version: v2
# AI extraction is not part of V1 (decided 2026-09-26): parsing is deterministic regex only, and AI
# must never decide geometry, distance, evidence, edges or zones. Setting this to true is rejected.
ai:
  enabled: false
# Handoff section 22: input hardening and resource ceilings. Inputs outside these limits fail loudly.
limits:
  allowed_document_extensions: [.pdf]
  max_document_bytes: 52428800
  max_projects_per_utility: 500
  # Stored source text per record; longer extractions are cut with a marker.
  max_raw_text_chars: 20000
  allowed_oracle_extensions: [.xlsx]
  max_oracle_bytes: 10485760
logging:
  level: INFO
normalization:
  date_formats: ["%m/%d/%Y", "%m/%d/%y"]
  # A voltage token: a number or a chain of numbers joined by - or / followed by kV ("230-115kV").
  voltage_pattern: '(?<![\w.])((?:\d+(?:\.\d+)?\s*[-/]\s*)*\d+(?:\.\d+)?)\s*kV\b'
  endpoints:
    # Title prefixes that name a sponsor or program, not a place ("SAV: ", "CC - ", "GRID - ").
    ignored_prefix_patterns:
      - '^[A-Z]{2,5}:\s*'
      - '^(?:CC|GRID)\s*[-–]\s*'
    # Customer-connection titles often name customer sites rather than substations.
    review_prefix_patterns:
      - '^(?:[A-Z]{2,5}:\s*)?CC\s*[-–]'
    separator_pattern: '\s*[-–]\s*'
    # The endpoint section of a title ends at the first voltage token or colon.
    section_end_patterns:
      - '(?<![\w.])(?:\d+(?:\.\d+)?\s*[-/]\s*)*\d+(?:\.\d+)?\s*kV\b'
      - ':'
    # Titles containing these name more than one circuit or site; only the first is used.
    multi_site_markers: [" & ", "/", ","]
    # Words that describe work rather than a place; a site name ends at the first one.
    descriptor_words:
      - SUBSTATION
      - SUB
      - CUSTOMER SUB
      - SWITCHING STATION
      - TAP
      - LINE
      - LOOP
      - TIE
      - TRANSMISSION
      - REBUILD
      - RECONDUCTOR
      - REACTOR
      - REACTORS
      - AUTOBANK
      - AUTOBANKS
      - AUTO BANK
      - BANK
      - CAP BANK
      - CAPACITOR
      - TRANSFORMER
      - NEW BUILD
      - NEW AUTO
      - NEW SUB
      - RELAY
      - RELAYS
      - RELAYING
      - BREAKER
      - BUS
      - BUSES
      - SWITCH
      - STATCOM
      - SMART VALVE
      - SMART VALVES
      - LOW SIDE
      - AREA
      - PROJECT
      - NETWORK
      - IMPROVEMENT
      - IMPROVEMENTS
      - UPGRADE
      - UPGRADES
      - EQUIPMENT
      - AKA
      - CC
    # Leftover bare numbers and punctuation at the end of a site name ("THOMASTON 230").
    trailing_noise_pattern: '(?:\s+\d[\d/]*|[\s.,;&/]+)+$'
    # A voltage unit left in a site name means the title did not match the voltage pattern (e.g. "23O KV").
    residue_pattern: '\bkV\b'
  project_types:
    rules:
      - type: reactor
        keywords: [REACTOR, REACTORS]
      - type: substation
        keywords: [SUBSTATION, SUB, AUTOBANK, AUTOBANKS, AUTO BANK, AUTO TRANSFORMER, TRANSFORMER, BANK,
                   CAP BANK, CAPACITOR, STATCOM, RELAY, RELAYS, RELAYING, BREAKER, BUS, BUSES, SWITCH,
                   SWITCHING STATION, SW HOUSE, LINE TRAP]
      - type: transmission_line
        keywords: [LINE, REBUILD, REBLD, RECONDUCTOR, TIE, TAP, FOLD-IN, LOOP, CONVERSION]
    # Used when no keyword matches but the title names two or more endpoints.
    endpoint_pair_type: transmission_line
    default_type: other
resolution:
  candidate_power_types: [substation]
  name_match_threshold: 90
  name_noise_words: [substation, sub, switching, switchyard, station, primary, pri, plant, dam]
  name_abbreviations: {n: north, s: south, e: east, w: west, jct: junction, rd: road}
  name_leading_abbreviations: {st: saint, ft: fort, mt: mount}
  name_suffix_equivalents: {borough: boro, burgh: burg}
  distinguishing_tokens: [north, south, east, west, upper, lower, new, old]
  same_site_radius_km: 3.0
  max_endpoint_separation_km: 250
  max_candidates_per_endpoint: 5
  tie_keywords: [TIE, TIES]
  tie_exclusion_phrases: [BUS TIE, BUS-TIE]
  overrides_file: overrides/geometry_overrides.yaml
# Handoff section 10. Part maxima: source 20 + identity 30 + geometry 35 + timeline 15 = 100.
evidence:
  source: {official_with_id: 20, official_weak_id: 15, secondary: 5, none: 0}
  identity: {name: 10, operator: 10, voltage: 5, region: 5}
  geometry:
    verified_full_line: 35
    verified_endpoints_straight_line: 30
    verified_endpoint_route: 22
    verified_single_endpoint: 15
    human_verified_override: 15
    approximate_area_centroid: 5
    unresolved: 0
  timeline: {construction_window: 15, start_and_in_service: 15, in_service_date: 10, unknown: 0}
  levels: {high: 80, medium: 50}
overlap:
  prefilter_slack_ratio: 0.05
  distance_decimals: 3
  coordinate_decimals: 7
  # Handoff section 11: deterministic coordination themes per spatial tier (no AI).
  playbooks:
    CROSSING: [crossing_structures, outage_sequencing]
    SHARED_CORRIDOR: [right_of_way, access_roads, permitting]
    SITE_LOGISTICS: [staging_yards, deliveries, site_logistics]
    CREWS_EQUIPMENT: [crews, contractors, heavy_equipment]
  playbook_labels:
    crossing_structures: Crossing structures
    outage_sequencing: Outage timing and sequencing
    right_of_way: Right-of-way
    access_roads: Access roads
    permitting: Permitting and corridor coordination
    staging_yards: Staging and laydown yards
    deliveries: Deliveries
    site_logistics: Site logistics
    crews: Crews
    contractors: Contractors
    heavy_equipment: Heavy equipment and mobilization
zones:
  # Handoff section 14 guards. Zones partition relationships, so no relationship is ever dropped.
  max_geographic_span_km: 60
  max_timeline_span_days: 730
  # "warn" flags zones whose in-service dates spread beyond the limit; "split" enforces it.
  # Chosen on the real data (2026-09-26): 48 of 55 relationships are over a year apart, so
  # splitting leaves ~44 single-relationship zones and no attention compression.
  timeline_guard: warn
  max_projects: null
  id_prefix: ZONE
  name_strip_words: [Substation, Switching Station, Switchyard]
  name_separator: " – "
# Handoff section 15: spatial tier first, timeline relevance second; evidence never changes priority.
# Tiers are never changed here. A crossing or shared corridor whose dates are more than max_gap_days
# apart is MEDIUM, so it cannot automatically outrank a timely zone (decided 2026-09-26).
# Unknown dates still pass, so a critical crossing is never hidden for lack of a date.
priority:
  rules:
    - {priority: HIGH, tiers: [CROSSING, SHARED_CORRIDOR], max_gap_days: 730}
    - {priority: MEDIUM, tiers: [CROSSING, SHARED_CORRIDOR]}
    - {priority: HIGH, tiers: [SITE_LOGISTICS], relevance: [OVERLAPPING, STRONG, MEANINGFUL]}
    - {priority: MEDIUM, tiers: [SITE_LOGISTICS]}
    - {priority: MEDIUM, tiers: [CREWS_EQUIPMENT], relevance: [OVERLAPPING, STRONG]}
  default: LOW
# S2 coordination impact estimator (docs/STRETCH_IMPLEMENTATION_PLAN.md). Ranges only, every value
# below approved at Gate A0; nothing here changes overlap, zones or priority.
impact:
  label: "Illustrative planning estimate: not engineering-grade"
  # Only pairs the engine already ranks HIGH or MEDIUM; LOW background pairs never inflate the estimate.
  candidate_priorities: [HIGH, MEDIUM]
  staging_tiers: [CROSSING, SHARED_CORRIDOR, SITE_LOGISTICS]
  timely_relevance: [OVERLAPPING, STRONG, MEANINGFUL]
  assumptions:
    yard_acres:
      id: A-1
      label: Temporary footprint of one staging / laydown yard
      low: 3
      high: 20
      unit: acres per yard
      basis: public_source
      source_title: "Southern California Edison, West of Devers Upgrade Project, Proponent's Environmental Assessment (Oct 2013), section 3.2"
      source_url: https://ia.cpuc.ca.gov/environment/info/aspen/westofdevers/pea/3.0_project_description_part3.pdf
      source_locator: 'p. 3-71: "Typically, each yard would be 3 to 20 acres in size"; Table 3.2-A lists 10 yards of 2.8-30.0 acres'
      caveat: A California 220 kV project; the document's stated typical range, not a Southeast-specific value.
      approved_by: Aaryan
      approved_on: 2026-09-27
    mobilization_share:
      id: A-2
      label: Project management, including mobilization and demobilization, as a share of project cost
      high: 0.055
      unit: share of project cost (ceiling)
      basis: public_source
      source_title: "MISO, Transmission Cost Estimation Guide for MTEP19 (Apr 16, 2019)"
      source_url: https://nocapx2020.info/wp-content/uploads/2019/07/Transmission-Cost-Estimation-Guide-for-MTEP-2019337433.pdf
      source_locator: 'p. 31: "5.5% of project cost estimate: Project management (including mobilization and demobilization)"'
      caveat: Covers all project management, not mobilization alone, so it is only a ceiling. MISO's 20% contingency and 7.5% AFUDC are not applied.
      approved_by: Aaryan
      approved_on: 2026-09-27
    avoidable_share:
      id: A-3
      label: Share of a cluster's mobilization avoided when its projects share one
      high: 0.5
      unit: share of the cluster's mobilization (ceiling)
      basis: derived
      source_title: GridLock arithmetic
      source_locator: "k projects sharing one mobilization avoid (k-1)/k of their separate mobilizations; capped at 1/2 (two projects: one of two avoided)"
      caveat: Assumes the shared mobilization's cost is split evenly. No public source isolates cross-utility shared-mobilization savings.
      approved_by: Aaryan
      approved_on: 2026-09-27
    cross_check:
      id: A-3x
      label: Construction savings reported when agencies bundle nearby projects
      low: 0.05
      high: 0.15
      unit: share of construction cost (reference only, not used in the arithmetic)
      basis: public_source
      source_title: "FHWA, Every Day Counts (EDC-5) Project Bundling fact sheet"
      source_url: https://www.fhwa.dot.gov/innovation/everydaycounts/edc_5/docs/project-bundling-factsheet.pdf
      source_locator: 'PennDOT pilot, 41 structures for $25 million: "a 5-15 percent savings on construction"'
      caveat: Bundling also saves through one contract, standard designs and bulk purchasing, which separate utilities coordinating logistics would not get.
      approved_by: Aaryan
      approved_on: 2026-09-27
labels:
  spatial_tiers:
    CROSSING: Touching or crossing
    SHARED_CORRIDOR: Shared corridor
    SITE_LOGISTICS: Site logistics
    CREWS_EQUIPMENT: Crews and equipment
  timeline_types:
    IN_SERVICE_GAP: In-service date gap
    WINDOW_OVERLAP: Construction windows overlap
    WINDOW_GAP: Gap between construction windows
    UNRESOLVED: Dates unknown
  timeline_relevance:
    OVERLAPPING: Overlapping
    STRONG: Strong
    MEANINGFUL: Meaningful
    POSSIBLE: Possible
    WEAK: Weak
    UNKNOWN: Unknown
  priority: {HIGH: High, MEDIUM: Medium, LOW: Low}
  endpoint_match_status:
    matched: Matched to public geometry
    override: Human-verified location
    no_candidate: No public feature with this name
    ambiguous: Several equally good candidates
    vetoed: Candidate rejected by a deterministic check
    separation_rejected: Candidates too far apart to be one project
  evidence_levels: {HIGH: High, MEDIUM: Medium, LOW: Low, UNRESOLVED: Unresolved}
  geometry_methods:
    verified_full_line: Verified line geometry
    verified_endpoints_straight_line: Straight line between verified endpoints
    verified_endpoint_route: One verified endpoint with route evidence
    verified_single_endpoint: One verified endpoint
    human_verified_override: Human-verified location
    approximate_area_centroid: Approximate area
    unresolved: Not located
api:
  service_name: gridlock
  host: 127.0.0.1
  port: 8010
  cors_origins: [http://localhost:3000]
  payload_file: gridlock.json
# The sponsor's Projects_Overlaps.xlsx (in the raw folder): a sanity check only, never pipeline input.
oracle:
  file: Projects_Overlaps.xlsx
  sheet: projects
  overlaps_sheet: overlaps
  project_ids:
    DESC_1: DESC-6809-E
    DESC_2: DESC-6810-A
    DESC_3: DESC-06367-D-G
    DESC_4: DESC-6807-B
    DESC_5: DESC-6808-S
    GPC_1: GPC-20793
    GPC_2: GPC-20277
    GPC_3: GPC-20065
    GPC_4: GPC-18492
    GPC_5: GPC-11821
